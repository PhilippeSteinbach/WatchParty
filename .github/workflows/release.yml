name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.1.0 (without v prefix)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '${{ github.event.inputs.version }}'. Must match semver: X.Y.Z"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update VERSION file
        run: echo "${{ github.event.inputs.version }}" > VERSION

      - name: Update client/package.json
        run: cd client && npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Update server/pom.xml
        run: cd server && ./mvnw versions:set -DnewVersion=${{ github.event.inputs.version }} -DgenerateBackupPoms=false -B

      - name: Commit, tag, and push release branch
        id: release_commit
        run: |
          BRANCH="release/v${{ github.event.inputs.version }}"
          git add -A
          git commit -m "chore(version): release v${{ github.event.inputs.version }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.release_commit.outputs.branch }}" \
            --title "chore(version): release v${{ github.event.inputs.version }}" \
            --body "Automated release PR for v${{ github.event.inputs.version }}."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/watchparty-api:${{ github.event.inputs.version }}
            ghcr.io/${{ steps.owner.outputs.name }}/watchparty-api:latest

      - name: Build & push Client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/watchparty-client:${{ github.event.inputs.version }}
            ghcr.io/${{ steps.owner.outputs.name }}/watchparty-client:latest

      # Tags pushed with the default GITHUB_TOKEN don't fire docker-publish.yml's `push: tags` trigger,
      # so it must be dispatched explicitly for the standalone image.
      - name: Trigger Docker Publish workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh workflow run docker-publish.yml --ref "v${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
