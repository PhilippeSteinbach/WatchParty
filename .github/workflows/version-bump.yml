name: Version Bump

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(version):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current version
        id: current
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$LAST_TAG" ]; then
            CURRENT_VERSION="${LAST_TAG#v}"
          else
            CURRENT_VERSION=$(cat VERSION | tr -d '[:space:]')
          fi
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Find merged PR number
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --state merged --search "${{ github.sha }}" --json number --jq '.[0].number')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Get PR labels and determine bump type
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          BUMP_TYPE="patch"

          if [ -n "$PR_NUMBER" ]; then
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
            if echo "$LABELS" | grep -q "^major$"; then
              BUMP_TYPE="major"
            elif echo "$LABELS" | grep -q "^minor$"; then
              BUMP_TYPE="minor"
            fi
          fi

          echo "type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          BUMP_TYPE="${{ steps.bump.outputs.type }}"

          if [ "$BUMP_TYPE" = "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$BUMP_TYPE" = "minor" ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update VERSION file
        run: echo "${{ steps.new.outputs.version }}" > VERSION

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update client version
        run: cd client && npm version ${{ steps.new.outputs.version }} --no-git-tag-version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven

      - name: Update server version
        run: cd server && ./mvnw versions:set -DnewVersion=${{ steps.new.outputs.version }} -DgenerateBackupPoms=false -B

      - name: Commit bump on dedicated branch
        id: bump_commit
        run: |
          BRANCH="chore/version-bump-v${{ steps.new.outputs.version }}"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "$BRANCH"
          git commit -m "chore(version): bump to ${{ steps.new.outputs.version }} [skip ci]"
          git push --force-with-lease origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update bump PR
        if: steps.bump_commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.bump_commit.outputs.branch }}"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "Version bump PR #$EXISTING_PR already exists."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(version): bump to ${{ steps.new.outputs.version }}" \
              --body "Automated version bump after merge to main.\n\n- Updates VERSION\n- Updates client/package.json version\n- Updates server/pom.xml version"
          fi

      - name: Create version tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.bump_commit.outputs.changed }}" != "true" ]; then
            echo "No version bump commit was created, skipping tag."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/v${{ steps.new.outputs.version }}" | grep -q .; then
            echo "Tag v${{ steps.new.outputs.version }} already exists, skipping tag push."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tag the bump commit itself (on the chore/version-bump branch), not github.sha
          # (the pre-bump commit) — otherwise the tag/image would ship the OLD version files.
          git tag "v${{ steps.new.outputs.version }}" "${{ steps.bump_commit.outputs.sha }}"
          git push origin "v${{ steps.new.outputs.version }}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Docker Publish workflow
        # Tags pushed with the default GITHUB_TOKEN don't fire other workflows' `push: tags` triggers,
        # so docker-publish.yml must be dispatched explicitly here.
        if: steps.tag.outputs.created == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh workflow run docker-publish.yml --ref "v${{ steps.new.outputs.version }}"
