name: Version Bump

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  # Bumps VERSION/package.json/pom.xml directly on the PR branch, before merge,
  # so the version bump ships as part of the same PR instead of a follow-up one.
  bump-pr-version:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current version
        id: current
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$LAST_TAG" ]; then
            CURRENT_VERSION="${LAST_TAG#v}"
          else
            CURRENT_VERSION=$(cat VERSION | tr -d '[:space:]')
          fi
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine bump type from PR labels
        id: bump
        run: |
          BUMP_TYPE="patch"
          LABELS='${{ join(github.event.pull_request.labels.*.name, ',') }}'
          if echo ",$LABELS," | grep -q ",major,"; then
            BUMP_TYPE="major"
          elif echo ",$LABELS," | grep -q ",minor,"; then
            BUMP_TYPE="minor"
          fi
          echo "type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          BUMP_TYPE="${{ steps.bump.outputs.type }}"

          if [ "$BUMP_TYPE" = "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$BUMP_TYPE" = "minor" ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if branch is already bumped
        id: skip
        run: |
          EXISTING=$(cat VERSION | tr -d '[:space:]')
          if [ "$EXISTING" = "${{ steps.new.outputs.version }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.skip.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update client version
        if: steps.skip.outputs.needed == 'true'
        run: cd client && npm version ${{ steps.new.outputs.version }} --no-git-tag-version

      - name: Set up JDK 21
        if: steps.skip.outputs.needed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven

      - name: Update server version
        if: steps.skip.outputs.needed == 'true'
        run: cd server && ./mvnw versions:set -DnewVersion=${{ steps.new.outputs.version }} -DgenerateBackupPoms=false -B

      - name: Update VERSION file
        if: steps.skip.outputs.needed == 'true'
        run: echo "${{ steps.new.outputs.version }}" > VERSION

      - name: Commit and push to PR branch
        if: steps.skip.outputs.needed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add -A
          # No [skip ci] here: the required status checks must report on this,
          # the PR's new HEAD commit, or branch protection waits on it forever.
          git commit -m "chore(version): bump to ${{ steps.new.outputs.version }}"
          git push origin HEAD:"${{ github.head_ref }}"
          # Pushes made with GITHUB_TOKEN do not start new workflow runs on their own,
          # so explicitly dispatch CI for the updated PR branch HEAD.
          gh workflow run ci.yml --ref "${{ github.head_ref }}"

  # After merge to main, the VERSION file already reflects the bump (it was part of the PR),
  # so we only need to tag the merge commit itself and kick off the Docker publish.
  tag-and-publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        id: tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "v${{ steps.version.outputs.version }}" "${{ github.sha }}"
          git push origin "v${{ steps.version.outputs.version }}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Docker Publish workflow
        # Tags pushed with the default GITHUB_TOKEN don't fire other workflows' `push: tags` triggers,
        # so docker-publish.yml must be dispatched explicitly here.
        if: steps.tag.outputs.created == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh workflow run docker-publish.yml --ref "v${{ steps.version.outputs.version }}"
